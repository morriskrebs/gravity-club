    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I book a class?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You book your class online. Your spot is only secured after payment."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to pay in advance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. All classes are paid in advance."
            }
          },
          {
            "@type": "Question",
            "name": "What if a class is full?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Join the waitlist on Eversports. If a spot opens up, you get notified right away."
            }
          },
          {
            "@type": "Question",
            "name": "Can I bring a friend?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Each person needs their own booking, so book your spots together while there's still room."
            }
          },
          {
            "@type": "Question",
            "name": "Is it suitable for beginners?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We provide adjustments for different fitness levels."
            }
          },
          {
            "@type": "Question",
            "name": "Do you have changing rooms or showers on-site?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "As Gravity Club is a pop-up experience, our space is intentionally minimal and focused purely on the workout."
            }
          },
          {
            "@type": "Question",
            "name": "Where exactly is it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "At Kanzlei Club in Zurich: the building directly to the left of Kino Xenix, just steps from Helvetiaplatz."
            }
          },
          {
            "@type": "Question",
            "name": "What should I bring?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Workout clothes, water and the right energy."
            }
          },
          {
            "@type": "Question",
            "name": "When should I arrive?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Please arrive 10–15 minutes before the class starts."
            }
          },
          {
            "@type": "Question",
            "name": "Can I cancel my booking?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can cancel free of charge up to 12 hours before the class starts. You'll get your credit back for a future class. It stays valid for the remaining validity period of your pass - cash refunds are not available."
            }
          }
        ]
      }
